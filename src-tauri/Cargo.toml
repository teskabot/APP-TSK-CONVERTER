[package]
name = "conversor"
version = "0.1.0"
edition = "2021"

[lib]
name = "conversor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
walkdir = "2"
dirs = "5"
num_cpus = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

# --- motor de imágenes ---
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "tiff"] }
img-parts = "0.3"        # ICC y EXIF en JPEG/PNG/WebP sin recodificar
mozjpeg = "0.10"         # salida JPEG
webp = "0.3"             # entrada y salida WebP (libwebp)
tiff = "0.9"             # salida TIFF (con ICC)
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }  # SVG de entrada
imagepipe = "0.5"        # RAW de entrada: revelado básico (CR2, NEF, ARW, DNG...)
# HEIC solo de ENTRADA: decodificar evita el codificador HEVC (x265, GPL y con patentes).
# Requiere libheif >= 1.17 nativa (ver LEEME-IMAGENES.md); por eso es opcional.
libheif-rs = { version = "2", default-features = false, features = ["v1_17"], optional = true }

[features]
default = []   # HEIC necesita libheif nativa: se activa con --features heic (ver LEEME-IMAGENES.md)
heic = ["dep:libheif-rs"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
